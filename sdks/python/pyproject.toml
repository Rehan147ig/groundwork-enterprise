[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "groundwork-python"
version = "0.1.0"
description = "Official Python SDK for Groundwork: zero-trust access control for AI agents with tamper-evident audit."
readme = "README.md"
license = "Apache-2.0"
authors = ["Groundwork"]
keywords = ["zero-trust", "rbac", "audit", "langchain", "retriever", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{ include = "groundwork" }]
include = ["groundwork/py.typed"]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
httpx = ">=0.27"

[tool.poetry.group.dev.dependencies]
langchain-core = ">=0.3"
llama-index-core = ">=0.12"
haystack-core = ">=2.0"
pytest = ">=8"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5"

[tool.poetry.extras]
langchain = ["langchain-core"]
llamaindex = ["llama-index-core"]
haystack = ["haystack-core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=groundwork --cov-report=term-missing"
asyncio_mode = "auto"