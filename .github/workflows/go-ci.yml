name: go-ci

# Builds, formats, vets, and tests the Go query-runtime (race detector included).
# Runs on every PR and on pushes to main. No path filter: this is a REQUIRED check,
# and a path-filtered required check stays "pending" (blocking merges) on PRs that don't
# touch its paths. Path-scoped skipping is a Phase 2 optimization (see docs/ci.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-ci:
    name: go-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/query-runtime
    # Postgres 16 service container for the SQL-level integration tests
    # (test/integration, `integration` build tag): immutable audit
    # ledger, write-once RULEs, hash-chain verification, and
    # cross-tenant isolation run against real Postgres in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: groundwork
          POSTGRES_DB: groundwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundwork -d groundwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/query-runtime/go.mod
          cache: false # cache is managed explicitly below, keyed on go.sum

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('services/query-runtime/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build ./...

      - name: gofmt (fail if any file is unformatted)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: all files formatted"

      - name: Vet
        run: go vet ./...

      - name: Ban dynamic SQL construction
        # Production SQL must be parameterized ($N placeholders). A
        # fmt.Sprintf-built statement fragments the query plan and is an
        # injection footgun even when "safe" today. Tests may build SQL,
        # so only non-test files are scanned.
        run: |
          if grep -rEn "fmt\.Sprintf\([^)]*(SELECT|INSERT|UPDATE|DELETE|ALTER)" --include="*.go" . --exclude="*_test.go" | grep -v "^Binary"; then
            echo "::error::Dynamic SQL via fmt.Sprintf is banned. Use parameterized \$N queries."
            exit 1
          fi
          echo "no dynamic SQL in production code"

      - name: Connector production-claims gate
        # A connector may declare Status: "production" only after a
        # verified production hardening review (allowlist in the
        # script). Every allowlisted connector must keep the flag.
        working-directory: .
        run: bash scripts/check-connector-production-claims.sh

      - name: govulncheck (supply-chain vulnerability scan)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: gosec (security static analysis)
        # Security-focused SAST. Findings are triaged in the normal PR
        # flow; the gate fails on high/medium so new issues block merge.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -quiet -confidence=high -severity=medium ./...

      - name: staticcheck (general static analysis)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Test
        run: go test ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Integration tests (Postgres 16 service container)
        # SQL-level integration suite: write-once audit RULEs, hash-chain
        # verification over Postgres, cross-tenant isolation under
        # concurrent writes, plus the other Postgres-backed suites
        # (usage, trust, agents, connectors). Engine end-to-end tests
        # that need SpiceDB+Qdrant skip cleanly via requireFullStack.
        env:
          GROUNDWORK_TEST_DATABASE_URL: postgres://groundwork:groundwork@localhost:5432/groundwork?sslmode=disable
        run: go test -v -tags=integration ./test/integration/...
